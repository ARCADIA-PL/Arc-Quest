modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
credits="HUD styles: Moderna by Jorge Avila (CC BY 3.0), Cyberpunk CSS by alddesign (MIT), Ore UI by katorlys (MPL-2.0), RPG Game UI by Wyrmheart (CC0 1.0). Sources and licenses: META-INF/licenses/."
logoFile="arc_quest_icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="arc_quest.mixins.json"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ponder"
    type="required"
    versionRange="[1.0.64,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="xaerominimap"
    type="optional"
    versionRange="[26.4.2,27)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.51.0.418,20)"
    ordering="AFTER"
    side="CLIENT"
