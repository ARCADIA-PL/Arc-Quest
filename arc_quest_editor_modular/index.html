<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Arc Quest // Datapack Editor Pro</title>
</head>
<body>
<div class="ambient-bg"></div>

<div class="app" id="appRoot">
    <header class="bar">
        <div class="title-area">
            <div class="app-icon">AQ</div>
            <div class="title">Arc Quest Editor <span class="badge">Pro</span></div>
        </div>
        <div class="toolbar">
            <button class="toolbar-btn" id="newBtn">
                <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                新建架构
            </button>
            <label class="toolbar-btn" for="fileInput">
                <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5-5 5 5M12 15V5"/>
                </svg>
                导入 JSON
            </label>
            <input accept=".json,application/json" id="fileInput" type="file"/>
            <button class="toolbar-btn" id="importLibBtn" title="导入到共享注册表，不替换当前编辑内容">
                <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14">
                    <path d="M19 21H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2zM16 2v4M8 2v4M3 10h18"/>
                </svg>
                导入到库
            </button>
            <button class="toolbar-btn primary" id="exportBtn">
                <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 14l5 5 5-5M12 15V3"/>
                </svg>
                导出序列
            </button>
            <button class="toolbar-btn" id="validateBtn">
                <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3"/>
                </svg>
                系统校验
            </button>
            <button class="toolbar-btn" id="crossBtn" title="校验跨文件引用完整性">
                <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="8.5" cy="7" r="4"/>
                    <path d="M20 8v6M23 11h-6"/>
                </svg>
                跨文件校验
            </button>
        </div>
    </header>

    <div class="mode-bar" id="modeBar">
        <button class="mode-tab active" data-mode="quest">
            <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6"/><polyline points="9 14 11 16 15 12"/></svg>
            Quest 任务
        </button>
        <button class="mode-tab" data-mode="npc">
            <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14"><circle cx="12" cy="10" r="3"/><path d="M12 2a8 8 0 0 0-8 8c0 5.4 8 12 8 12s8-6.6 8-12a8 8 0 0 0-8-8z"/></svg>
            NPC 绑定
        </button>
        <button class="mode-tab" data-mode="dialogue">
            <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            对话树
        </button>
        <button class="mode-tab" data-mode="trade">
            <svg fill="none" height="14" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>
            商店
        </button>
    </div>

    <div class="main" id="mainLayout">
        <aside class="pane glass-pane" id="left"></aside>
        <div aria-label="调整左侧宽度" class="pane-resizer" id="resizerLeft" role="separator"></div>
        <main class="pane center-pane" id="mid"></main>
        <div aria-label="调整右侧宽度" class="pane-resizer" id="resizerRight" role="separator"></div>
        <aside class="pane glass-pane right" id="right-container">
            <div class="tabs" id="tabs"></div>
            <div class="panel" id="right"></div>
        </aside>
    </div>

    <footer class="status glass-pane" id="status"></footer>
</div>

<div aria-hidden="true" class="drop-overlay" id="dropOverlay">
    <div class="drop-card">
        <div class="drop-title">拖入 Quest JSON</div>
        <div class="drop-subtitle" id="dropSubtitle">松开以导入 Arc Quest 任务文件</div>
    </div>
</div>

<div aria-atomic="true" aria-live="polite" class="toast-stack" id="toastStack"></div>

<script src="./scripts/app.js" type="module"></script>
</body>
</html>
