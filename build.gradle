plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.74'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// Launcher-backed verification code stays outside release jars.
sourceSets { gameTest {} }
def clientAudits = ['objectiveIconRuntimeAudit', 'jeiRuntimeAudit', 'shopPerformanceAudit',
                    'trackerLayoutRuntimeAudit', 'questToastRuntimeAudit', 'collectionRuntimeAudit']
if (clientAudits.count { project.hasProperty(it) } > 1) {
    throw new GradleException('Run client audits separately; each owns its verification scenario.')
}
sourceSets.gameTest.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.gameTest.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('collectionRuntimeAudit')) {
                systemProperty 'arc_quest.collection.audit', 'true'
                programArguments.addAll '--width', '1280', '--height', '720'
                // Finite title-screen collection fixtures; never open a saved world.
            }
            if (project.hasProperty('questToastRuntimeAudit')) {
                systemProperty 'arc_quest.quest.toast.audit', 'true'
            }
            if (project.hasProperty('trackerLayoutRuntimeAudit')) {
                systemProperty 'arc_quest.tracker.layout.audit', 'true'
            }
            if (project.hasProperty('objectiveIconRuntimeAudit')) {
                systemProperty 'arc_quest.objective.icons.audit', 'true'
                programArguments.addAll '--quickPlaySingleplayer', 'ArcQ Objective Icon Verification'
            }
            if (project.hasProperty('jeiRuntimeAudit')) {
                systemProperty 'arc_quest.jei.audit', 'true'
                programArguments.addAll '--quickPlaySingleplayer', 'ArcQ JEI Verification'
            }
            if (project.hasProperty('shopPerformanceAudit')) {
                systemProperty 'arc_quest.shop.performance.audit', 'true'
                systemProperty 'arc_quest.shop.performance.label', project.findProperty('shopPerformanceLabel') ?: 'after'
                programArguments.addAll '--quickPlaySingleplayer', 'ArcQ JEI Verification'
            }
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('build/neoforge-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (clientAudits.any { project.hasProperty(it) } || project.hasProperty('jeiServerAudit')) {
                sourceSet(sourceSets.gameTest)
            }
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/'
}

repositories {
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' } }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com/' }
    maven {
        url "https://chocolateminecraft.com/maven"
        name "Xaero's Maven"
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    testImplementation "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    testImplementation "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (!project.hasProperty('withoutJei')) {
        runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
    implementation(jarJar("net.createmod.ponder:ponder-neoforge:${ponder_version}")) {
        transitive = false
    }
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    implementation(jarJar("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"))

    implementation "xaero.minimap:xaerominimap-neoforge-1.21.1:26.4.2"
    implementation "xaero.map:xaeroworldmap-neoforge-1.21.1:1.44.2"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (project.hasProperty('aqMaxErrs')) {
        options.compilerArgs += ['-Xmaxerrs', project.property('aqMaxErrs').toString()]
    }
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = 'inherit'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'arcq.test.projectDir', projectDir.absolutePath
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

if (clientAudits.any { project.hasProperty(it) }) {
    tasks.named('runClient').configure {
        doLast {
            def logFile = file('run/logs/latest.log')
            def logText = logFile.exists() ? logFile.getText('UTF-8') : ''
            def marker = project.hasProperty('collectionRuntimeAudit') ? '[ARCQ_COLLECTION_CLIENT_AUDIT]'
                    : project.hasProperty('questToastRuntimeAudit') ? '[ARCQ_QUEST_TOAST_AUDIT]'
                    : project.hasProperty('trackerLayoutRuntimeAudit') ? '[ARCQ_TRACKER_LAYOUT_AUDIT]'
                    : project.hasProperty('objectiveIconRuntimeAudit') ? '[ARCQ_OBJECTIVE_ICON_AUDIT]'
                    : project.hasProperty('shopPerformanceAudit') ? '[ARCQ_SHOP_PERFORMANCE_AUDIT]'
                    : '[ARCQ_JEI_CLIENT_AUDIT]'
            if (!logText.contains(marker + ' PASS') || logText.contains(marker + ' FAIL')) {
                throw new GradleException(marker + ' runtime audit did not pass; inspect run/logs/latest.log.')
            }
        }
    }
}
