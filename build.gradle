buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_id}-forge${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// Launcher-backed acceptance tests are opt-in and never included in release jars.
sourceSets { gameTest {} }
if (['objectiveIconRuntimeAudit', 'jeiRuntimeAudit', 'shopPerformanceAudit', 'trackerLayoutRuntimeAudit', 'questToastRuntimeAudit'].count { project.hasProperty(it) } > 1) {
    throw new GradleException('Run client audits separately; each owns its verification scenario.')
}
sourceSets.gameTest.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.gameTest.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            if (project.hasProperty('questToastRuntimeAudit')) {
                property 'arc_quest.quest.toast.audit', 'true'
                // Renderer-only title-screen acceptance; no quick-play or saved worlds.
                mods { "${mod_id}" { source sourceSets.gameTest } }
            }
            if (project.hasProperty('trackerLayoutRuntimeAudit')) {
                property 'arc_quest.tracker.layout.audit', 'true'
                // The layout editor is verified at the title screen; never open any save.
                mods { "${mod_id}" { source sourceSets.gameTest } }
            }
            if (project.hasProperty('shopPerformanceAudit')) {
                property 'arc_quest.shop.performance.audit', 'true'
                property 'arc_quest.shop.performance.label', project.findProperty('shopPerformanceLabel') ?: 'after'
                args '--quickPlaySingleplayer', 'ArcQ JEI Verification'
                mods { "${mod_id}" { source sourceSets.gameTest } }
            }
            if (project.hasProperty('objectiveIconRuntimeAudit')) {
                property 'arc_quest.objective.icons.audit', 'true'
                args '--quickPlaySingleplayer', 'ArcQ Objective Icon Verification'
                mods { "${mod_id}" { source sourceSets.gameTest } }
            }
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('jeiRuntimeAudit')) {
                property 'arc_quest.jei.audit', 'true'
                args '--quickPlaySingleplayer', 'ArcQ JEI Verification'
                mods { "${mod_id}" { source sourceSets.gameTest } }
            }
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory project.file('build/jei-gametest')
            mods { "${mod_id}" { source sourceSets.gameTest } }
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

jar {
    manifest.attributes('FMLAT': 'accesstransformer.cfg')
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('sourcesJar', Jar).configure {
    include '**/*.java'
}

repositories {
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
    maven { name "create maven"; url "https://maven.createmod.net" }
    maven {
        url "https://chocolateminecraft.com/maven"
        name "Xaero's Maven"
    }
    maven { url "https://cursemaven.com"; content { includeGroup "curse.maven" } }
    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        forRepositories(fg.repository)
        filter { includeGroup "maven.modrinth" }
    }
    flatDir { dir 'libs' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    // -PwithoutJei exercises the same client/server without the optional viewer.
    if (!project.hasProperty('withoutJei')) {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }

    implementation fg.deobf("curse.maven:epic-fight-mod-405076:7919289")
    implementation fg.deobf("curse.maven:epic-fight-skill-tree-1295882:7734067")
    implementation fg.deobf('libs:epic_fight_ponder:1.0.0')
    // Existing rendering mods are client-only; keep them out of dedicated-server acceptance runs.
    def renderingConfiguration = project.hasProperty('jeiServerAudit') ? 'compileOnly' : 'implementation'
    add(renderingConfiguration, fg.deobf("curse.maven:embeddium-908741:5556138"))
    add(renderingConfiguration, fg.deobf("curse.maven:chloride-931925:6615986"))
    add(renderingConfiguration, fg.deobf("curse.maven:oculus-581495:5299671"))
    compileOnly "xaero.minimap:xaerominimap-forge-1.20.1:26.4.2:dev"
    runtimeOnly "xaero.minimap:xaerominimap-forge-1.20.1:26.4.2:dev"
    implementation "xaero.map:xaeroworldmap-forge-1.20.1:1.44.2:dev"
    runtimeOnly fg.deobf("curse.maven:selene-499980:5478857")
    runtimeOnly fg.deobf("curse.maven:mmmmmmmmmmmm-225738:5319203")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))

    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.0")) {
        jarJar.ranged(it, "[0.5.0,)")
    }

    implementation(jarJar(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))) {
        jarJar.ranged(it, "[${ponder_version},)")
        transitive = false
    }

    implementation(jarJar(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))) {
        jarJar.ranged(it, "[${flywheel_version},)")
    }
    
    //单元测试依赖
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (project.hasProperty('aqMaxErrs')) {
        options.compilerArgs += ['-Xmaxerrs', project.property('aqMaxErrs').toString()]
    }
}

//单元测试配置
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

// The finite client audit exits Minecraft normally on both paths; require its explicit PASS.
if (project.hasProperty('objectiveIconRuntimeAudit') || project.hasProperty('jeiRuntimeAudit') || project.hasProperty('shopPerformanceAudit') || project.hasProperty('trackerLayoutRuntimeAudit') || project.hasProperty('questToastRuntimeAudit')) {
    tasks.matching { it.name == 'runClient' }.configureEach {
        doLast {
            def auditLog = file('run/logs/latest.log')
            def auditText = auditLog.exists() ? auditLog.getText('UTF-8') : ''
            def auditMarker = project.hasProperty('questToastRuntimeAudit')
                    ? '[ARCQ_QUEST_TOAST_AUDIT]' : project.hasProperty('trackerLayoutRuntimeAudit')
                    ? '[ARCQ_TRACKER_LAYOUT_AUDIT]' : project.hasProperty('objectiveIconRuntimeAudit')
                    ? '[ARCQ_OBJECTIVE_ICON_AUDIT]' : project.hasProperty('shopPerformanceAudit')
                    ? '[ARCQ_SHOP_PERFORMANCE_AUDIT]' : '[ARCQ_JEI_CLIENT_AUDIT]'
            if (!auditText.contains(auditMarker + ' PASS') || auditText.contains(auditMarker + ' FAIL')) {
                throw new GradleException(auditMarker + ' runtime audit did not pass; inspect run/logs/latest.log.')
            }
        }
    }
}
